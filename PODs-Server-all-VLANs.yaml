apiVersion: v1
kind: Pod
metadata:
  name: iperf3-server-vlan100
  namespace: default
spec:
  hostNetwork: true
  nodeName: hub-worker01.ocp4-hub.test.com
  containers:
  - name: iperf3
    image: networkstatic/iperf3
    args: ["-s", "-p", "5201"]

apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-vlan100
  namespace: tc-virt-validation
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm-vlan100
    spec:
      nodeSelector:
        kubernetes.io/hostname: "hub-worker01.ocp4-hub.test.com"
      domain:
        devices:
          disks:
            - name: containerdisk
              disk: { bus: virtio }
            - name: cloudinitdisk
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
            - name: secondary
              bridge: {}
        resources:
          requests:
            memory: 1024Mi
            cpu: 100m
      networks:
        - name: default
          pod: {}
        - name: secondary
          multus:
            networkName: nad-vlan100
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/fedora:latest
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: redhat
              password: ocp4
              chpasswd: { expire: False }
              ssh_pwauth: True
              ssh_authorized_keys:
                - ssh-rsa  rbruzzon@rbruzzon-platinum.server.test.com
              runcmd:
                - dnf install -y iperf3 || true
                - nmcli connection add type ethernet ifname enp2s0 con-name eth-secondary ip4 10.0.100.202/24 autoconnect yes || true
                - nmcli connection up eth-secondary || true
---

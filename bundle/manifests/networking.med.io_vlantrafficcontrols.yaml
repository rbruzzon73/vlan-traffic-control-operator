                  None]'
                type: object
              reconcileIntervalSeconds:
                default: 30
                description: 'Interval in seconds between node agent reconciliation
                  loops. [OPTIONAL | Default: 30]'
                type: integer
              tcStrategy:
                default: flower
                description: 'Traffic classification strategy used by TC. Select ''flower''

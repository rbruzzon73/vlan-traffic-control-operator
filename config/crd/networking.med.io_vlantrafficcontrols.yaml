    - vtc
    - vtcs
    singular: vlantrafficcontrol
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VlanTrafficControl is the Schema for the vlantrafficcontrols
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VlanTrafficControlSpec defines the desired state of VlanTrafficControl.
            properties:
              htbRoot:
                description: HtbRoot defines the root HTB qdisc and class tree configuration.
                properties:
                  classes:
                    description: Classes is the list of HTB leaf classes attached
                      to this root.
                    items:
                      description: ClassSpec defines individual HTB class configuration
                        parameters.
                      properties:
                        classId:
                          description: ClassID is the full HTB class identifier (e.g.
                            "1:100").
                          type: string
                        classMinor:
                          description: ClassMinor is the minor ID of the HTB class
                            (e.g. 100 for handle 1:100).
                          type: integer
                        dscp:
                          description: Dscp is the Differentiated Services Code Point
                            value to match (0-63).
                          type: integer
                        egressCeil:
                          description: EgressCeil is the maximum burstable egress
                            bandwidth rate (e.g. "500Mbit").
                          type: string
                        egressRate:
                          description: EgressRate is the guaranteed egress bandwidth
                            rate (e.g. "100Mbit", "1Gbit").
                          type: string
                        ingressRate:
                          description: IngressRate is the maximum ingress rate limit
                            for traffic policing.
                          type: string
                        ip:
                          description: IP is a single IP address to match.
                          type: string
                        matchType:
                          description: 'MatchType defines how traffic is classified:
                            "vlan", "subnet", "ip", "port", or "dscp".'
                          type: string
                        name:
                          description: Name is a descriptive human-readable name for
                            this traffic class.
                          type: string
                        port:
                          description: Port is a L4 TCP/UDP port number to match.
                          type: integer
                        priority:
                          description: Priority is the HTB class priority (0-7, lower
                            numbers indicate higher priority).
                          type: integer
                        subnet:
                          description: Subnet is the CIDR block to match for egress/ingress
                            policing (e.g. "10.0.100.0/24").
                          type: string
                        vlanId:
                          description: VlanID is the 802.1Q VLAN tag ID to match (1-4094).
                          type: integer
                      required:
                      - egressRate
                      - matchType
                      - name
                      type: object
                    type: array
                  defaultClassId:
                    description: DefaultClassID is the fallback HTB class handle for
                      unmatched traffic.
                    type: string
                  defaultClassMinor:
                    default: 99
                    description: DefaultClassMinor is the minor ID of the default
                      HTB class (e.g. 99 for handle "1:99").
                    type: integer
                  htbId:
                    default: 1
                    description: HtbID is the root qdisc handle ID (e.g. 1 for handle
                      "1:").
                    type: integer
                  interface:
                    description: Interface is the target network interface on the
                      host (e.g. "enp1s0.100").
                    type: string
                  rate:
                    description: Rate is the total root qdisc capacity (e.g. "10Gbit").
                    type: string
                required:
                - classes
                - interface
                - rate
                type: object
              nodeLabelSelector:
                description: NodeLabelSelector provides full Kubernetes label selector
                  matching (matchLabels & matchExpressions).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector is an optional map of key-value pairs to
                  target specific nodes.
                type: object
              reconcileIntervalSeconds:
                default: 30
                description: ReconcileIntervalSeconds defines the interval in seconds
                  between node agent reconciliation loops.
                type: integer
              tcStrategy:
                default: flower
                description: 'TcStrategy specifies the strategy used to classify traffic:
                  "flower", "u32", or "auto".'
                enum:
                - flower
                - u32
                - auto
                type: string
              tolerations:
                description: Tolerations allows optional policy scheduling tolerations
                  (e.g. to enforce policies on Master nodes).
                items:
                  description: TolerationSpec represents pod/CR policy scheduling
                    tolerations (e.g., Master/Control-Plane nodes).
                  properties:
                    effect:
                      description: Effect indicates the taint effect to match. Empty
                        means match all taint effects.
                      type: string
                    key:
                      description: Key is the taint key that the toleration applies
                        to.
                      type: string
                    operator:
                      description: Operator represents a key's relationship to the
                        value. Valid values are Exists and Equal.
                      type: string
                    value:
                      description: Value is the taint value the toleration matches
                        to.
                      type: string
                  type: object
                type: array
            required:
            - htbRoot
            - tcStrategy
            type: object
          status:
            description: VlanTrafficControlStatus defines the observed state of VlanTrafficControl.
            properties:
              activeNodes:
                description: ActiveNodes lists host nodes currently enforcing this
                  policy.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions track the reconciliation state and health
                  of the traffic control policy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration represents the last generation reconciled
                  by the operator.
                format: int64
                type: integer
            type: object
        type: object

apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    description: "The VLAN Traffic Control Operator manages eBPF/TC flower ingress policing \nand HTB egress bandwidth shaping per VLAN directly on OpenShift worker nodes.\n"
    operatorframework.io/suggested-namespace: openshift-vlan-tc-operator
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: vlan-traffic-control.v0.2.32
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: Advanced VLAN ingress policing and egress HTB traffic control operator for OpenShift.
      displayName: VLAN Traffic Control
      kind: VlanTrafficControl
      name: vlantrafficcontrols.networking.med.io
      specDescriptors: []
      version: v1alpha1
  description: Advanced VLAN ingress policing and egress HTB traffic control operator for OpenShift.
  displayName: VLAN Traffic Control Operator
  icon:
  - base64data:  
    mediatype: image/svg+xml
  install:
    strategy: deployment
    spec:
      clusterPermissions:
      - serviceAccountName: vlan-traffic-control-manager
        rules:
        - apiGroups:
          - security.openshift.io
          resourceNames:
          - privileged
          resources:
          - securitycontextconstraints
          verbs:
          - use
        - apiGroups:
          - ''
          resources:
          - pods
          - pods/log
          - pods/status
          - services
          - nodes
          - configmaps
          - events
          verbs:
          - '*'
        - apiGroups:
          - apps
          resources:
          - daemonsets
          - deployments
          - replicasets
          verbs:
          - '*'
        - apiGroups:
          - networking.med.io
          resources:
          - vlantrafficcontrols
          - vlantrafficcontrols/status
          - vlantrafficcontrols/finalizers
          verbs:
          - '*'
        - apiGroups:
          - metrics.k8s.io
          resources:
          - pods
          - nodes
          verbs:
          - get
          - list
          - watch
      deployments:
      - name: vlan-traffic-control-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              labels:
                control-plane: controller-manager
            spec:
              serviceAccountName: vlan-traffic-control-manager
              containers:
              - command:
                - /manager
                image: ghcr.io/rbruzzon73/vlan-traffic-control-operator:v0.2.41
                imagePullPolicy: Always
                name: manager
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: true
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - vlan-traffic-control
  links:
  - name: Vlan Traffic Control
    url: https://github.com/rbruzzon73/vlan-traffic-control-operator
  maintainers:
  - email: rbruzzon73@github.com
    name: rbruzzon73
  maturity: alpha
  provider:
    name: rbruzzon73
    url: https://github.com/rbruzzon73
  version: 0.2.32
